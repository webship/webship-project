################################################################################
# Webship Project template — GitLab CI.
#
# This repo is the composer `type: project` TEMPLATE (`drupal/webship_project`):
# `composer install` pulls in `drupal/webship` (the distribution profile) plus
# every web* component module. Includes the shared Drupal.org (drupalci)
# pipeline for the standard PHP lint/test jobs, then adds:
#   * fast Node lint jobs (eslint, stylelint, cspell) that do NOT need the
#     full Drupal build artifact, and
#   * a `webship-js-test` job that builds the whole distribution via this
#     template's own composer.json, installs the Webship profile end to end
#     on a fresh Drupal ~11.4.0 site, and runs the webship-js Playwright +
#     Cucumber-js acceptance suite that ships inside the installed
#     `drupal/webship` profile package (web/profiles/contrib/webship).
################################################################################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

# No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
# refuse to create one. Allow lockfile creation in CI for every job.
variables:
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# The shared drupalci `composer` job (include.drupalci.main.yml) is built for
# MODULES/THEMES/PROFILES: it runs expand_composer_json.php, which merges the
# project's composer.json into a module-style scaffold that (among other
# things) injects cweagans/composer-patches ~1.7.3 for core patching. This
# template is the opposite: a composer `type: project` template that is
# itself the site's root composer.json (it requires drupal/core and
# webship/webship directly, and requires cweagans/composer-patches ~2.0
# itself). Running it through expand_composer_json.php produces a version
# conflict (root requires ~2.0, expand_composer_json.php's scaffold pins
# 1.7.3) that has nothing to do with this template's own dependency graph —
# verified with a clean `composer install` against this composer.json alone,
# which resolves cweagans/composer-patches at 2.0.0 with no conflict.
# So: override `composer` with a plain `composer install` of the template's
# own composer.json, matching exactly what a real `composer create-project
# drupal/webship_project` does. `phpcs`/`phpstan`/`composer-lint` (the last
# one from the shared include, unmodified) need PHPCS/PHPStan/parallel-lint,
# which the expand_composer_json.php scaffold would otherwise have provided
# for free — they're now required directly below (require-dev) so a plain
# composer install still gives every validate-stage job its tools.
composer:
  stage: build
  rules:
    - when: on_success
  variables:
    COMPOSER_NO_INTERACTION: 1
  script:
    - cd $CI_PROJECT_DIR && pwd
    - composer --version
    - composer validate
    - composer install --no-interaction
    # This template's composer.json sets config.bin-dir to "bin/" (not the
    # Composer default vendor/bin/) — export it so the validate-stage jobs
    # below (and composer-lint from the shared include) find phpcs/phpstan/
    # parallel-lint at the right path.
    - echo "COMPOSER_BIN_DIR=$CI_PROJECT_DIR/bin" >> build.env
  artifacts:
    expire_in: 1 week
    when: always
    exclude:
      - '.git'
      - '.git/**/*'
      - '$_WEB_ROOT/**/.git'
      - '$_WEB_ROOT/**/.git/**/*'
      - 'vendor/**/.git'
      - 'vendor/**/.git/**/*'
    name: artifacts-$CI_PIPELINE_ID-$CI_JOB_NAME_SLUG
    paths:
      - .
    reports:
      dotenv: build.env

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

# Shared setup for the fast lint jobs (eslint, stylelint).
#
# Three things keep these jobs quick:
#   1. `dependencies: []` — the lint jobs do NOT need the composer job's build
#      artifact (the full Drupal tree). Skipping it avoids downloading and then
#      walking thousands of vendor/ files.
#   2. `yarn install --mode=skip-build` — skips every package's build/postinstall
#      step (eslint/stylelint need none, and it avoids webship-js's postinstall
#      pulling the Playwright browsers). Install drops to ~10s.
#   3. Lockfile-keyed cache of `.yarn/cache` so later pipelines reuse packages.
# The paired .eslintignore excludes vendor/, .yarn/, web/ and node_modules/ so
# `eslint .` only lints real template source.
.lint-yarn:
  image: node:20
  dependencies: []
  variables:
    YARN_ENABLE_GLOBAL_CACHE: "false"
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
  before_script:
    - corepack enable
    - yarn install --mode=skip-build

eslint:
  extends: .lint-yarn
  stage: validate
  script:
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: true

stylelint:
  extends: .lint-yarn
  stage: validate
  # The shared drupalci pipeline (include.drupalci.main.yml) also defines a
  # `stylelint` job, but only creates it when the repo has `**/*.css` files
  # (rules: exists: ...). Same-named jobs from a local file and an include
  # are deep-merged key by key, so without this override our job would
  # silently inherit that gating rule and never run. This template has no
  # CSS of its own — override `rules:` so the job still runs (and passes
  # trivially) for pipeline-shape parity with the other web* projects.
  rules:
    - when: on_success
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: true

# The shared drupalci `phpcs` / `phpstan` jobs are also gated by an
# `exists:` rule (real .php/.module/... files somewhere in the repo) and
# assume `$DRUPAL_PROJECT_FOLDER` is a module/theme installed under
# web/modules|themes/custom/<name>, which doesn't apply to this composer
# `type: project` template. For pipeline-shape parity with the other web*
# projects (composer-lint, phpcs, phpstan, eslint, stylelint, cspell all
# present in the validate stage) these are self-contained overrides that
# check the template's own source (excluding vendor/, $_WEB_ROOT/ and
# node_modules/) and pass trivially since this template ships no PHP.
phpcs:
  stage: validate
  needs: [composer]
  rules:
    - when: on_success
  script:
    - cd $CI_PROJECT_DIR
    - PHP_FILES=$(find . -type f \( -name "*.php" -o -name "*.module" -o -name "*.inc" -o -name "*.install" -o -name "*.test" -o -name "*.profile" -o -name "*.theme" \) -not -path "./vendor/*" -not -path "./$_WEB_ROOT/*" -not -path "./node_modules/*" 2>/dev/null | wc -l) || true
    - |
      if [ "$PHP_FILES" -gt 0 ]; then
        $COMPOSER_BIN_DIR/phpcs . --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme --ignore=vendor/*,$_WEB_ROOT/*,node_modules/* -s --report-junit=junit.xml --report-full --report-summary || true
      else
        echo "This project template has no PHP files of its own to check with PHPCS; nothing to do."
        touch junit.xml
      fi
  allow_failure: true
  artifacts:
    when: always
    expire_in: 6 mos
    paths:
      - junit.xml
    reports:
      junit: junit.xml

phpstan:
  stage: validate
  needs: [composer]
  rules:
    - when: on_success
  script:
    - cd $CI_PROJECT_DIR
    - PHP_FILES=$(find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./$_WEB_ROOT/*" -not -path "./node_modules/*" 2>/dev/null | wc -l) || true
    - |
      if [ "$PHP_FILES" -gt 0 ] && [ -e $COMPOSER_BIN_DIR/phpstan ]; then
        php $COMPOSER_BIN_DIR/phpstan analyze . --autoload-file="$CI_PROJECT_DIR/vendor/autoload.php" --no-progress --error-format=junit > junit.xml || true
      else
        echo "This project template has no PHP files of its own to check with PHPStan; nothing to do."
        touch junit.xml
      fi
  allow_failure: true
  artifacts:
    when: always
    expire_in: 6 mos
    paths:
      - junit.xml
    reports:
      junit: junit.xml

# Full Drupal + Node.js setup for the browser acceptance tests.
#
# How it works:
#   1. The drupalci `composer` job builds a full Drupal site from this
#      template's own composer.json (Drupal ~11.4.0 + `drupal/webship`, which
#      pulls in every web* component module) and passes its artifact to this
#      job via `needs: [composer]`.
#   2. This job runs inside the drupalci PHP-Apache image (inherited from
#      `.testing-job-base`) which already has PHP, Apache, Drush, and MySQL.
#   3. before_script installs the Webship *profile* (which brings in all the
#      component modules, recipes and demo content), provisions the three
#      per-role test users the suite logs in as, then installs Node.js 20 +
#      yarn deps + Playwright Chromium INSIDE the installed profile package
#      (web/profiles/contrib/webship), which is where the profile ships its
#      own package.json, cucumber.js and tests/ directory. Test jobs only
#      override `script:`.
# ------------------------------------------------------------------------------
.drupal-node-base:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services. We only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "Admin"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    _WEBSHIP_PROFILE_DIR: "$CI_PROJECT_DIR/$_WEB_ROOT/profiles/contrib/webship"
  before_script:
    # Web server.
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    # Database.
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    # Install the Webship distribution profile end to end.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install webship
        --db-url=$SIMPLETEST_DB
        --account-name="Admin"
        --account-pass=dD.123123ddd
        --account-mail=info@webship.co
        --site-name="Webship"
        -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Provision the per-role test users the suite authenticates as.
    # These match cucumber.js worldParameters.users and
    # scripts/webship.users.yml inside the installed webship profile.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "Authenticated user"
        --mail="test.authenticated@webship.org" --password=dD.123123ddd || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "Content editor"
        --mail="test.content_editor@webship.org" --password=dD.123123ddd || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:role:add content_editor "Content editor" || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Node.js 20.
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    # Yarn deps + Playwright Chromium, run from inside the installed profile
    # package where package.json / cucumber.js / tests/ actually live.
    - cd $_WEBSHIP_PROFILE_DIR
    # Force node_modules layout so node_modules/.bin/* is populated.
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js. webship-js's postinstall can clobber it under yarn 4
    # because INIT_CWD may differ from the profile root inside the container.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    # Restore cucumber.js if postinstall overwrote it with the init template.
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# webship-js BDD acceptance tests for the whole distribution, built from this
# template's composer.json.
webship-js-test:
  extends: .drupal-node-base
  script:
    - cd $_WEBSHIP_PROFILE_DIR
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - $_WEB_ROOT/profiles/contrib/webship/tests/reports/
      - $_WEB_ROOT/profiles/contrib/webship/tests/screenshots/
      - $_WEB_ROOT/profiles/contrib/webship/tests/videos/
    expire_in: 7 days
    reports:
      junit: $_WEB_ROOT/profiles/contrib/webship/tests/reports/junit.xml
  allow_failure: false
